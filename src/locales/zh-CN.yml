agentInstructions:
  noConfiguration: （尚未配置）
  text: |
    我在用浏览器扩展 Plainly（素读）翻译网页，请帮我配置它的翻译服务。
    先阅读说明：$1
    按说明操作：问清我要用哪家服务、API Key 在哪里、我读什么语言；用我的 Key 按说明里的请求模板验证，直到请求成功；把配置 JSON 写入我的剪贴板；最后告诉我在 Plainly 弹窗里粘贴并应用。
    我当前的配置（密钥已脱敏）：
    $2
