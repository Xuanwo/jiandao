  sameLanguage: Исходный и целевой языки должны различаться
  noApiKey: Сначала добавьте API-ключ. Нажмите на значок Jiandao на панели инструментов, чтобы настроить его.
  failed: Не удалось перевести
  retry: Повторить
  unknownError: Что-то пошло не так
agentInstructions:
  noConfiguration: (пока нет)
  text: |
    Я перевожу веб-страницы с помощью расширения браузера Jiandao (简道翻译). Пожалуйста, настрой для меня его сервис перевода.
    Сначала прочитай руководство: $1
    Действуй по нему: спроси, какой сервис я хочу, где мой API-ключ и на каком языке я читаю. Проверь запрос с моим ключом по шаблону из руководства, пока запрос не пройдёт успешно. Запиши JSON конфигурации в мой буфер обмена. Затем скажи мне вставить его во всплывающее окно Jiandao и применить.
    Моя текущая конфигурация, ключ скрыт:
    $2
