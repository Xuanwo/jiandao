agentInstructions:
  noConfiguration: （まだありません）
  text: |
    ブラウザー拡張機能 Plainly（素读）でウェブページを翻訳しています。翻訳サービスを設定してください。
    まずガイドを読んでください：$1
    ガイドに従ってください：使いたいサービス、API キーの場所、私が読む言語を私に聞いてください。ガイドのリクエストテンプレートを使って私のキーで検証し、リクエストが成功するまで続けてください。構成の JSON を私のクリップボードに書き込んでください。最後に、Plainly のポップアップに貼り付けて適用するよう私に伝えてください。
    現在の構成（キーは伏せてあります）：
    $2
