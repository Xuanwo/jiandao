translation:
  sameLanguage: ソース言語とターゲット言語は異なる必要があります
  noApiKey: まず API キーを追加してください。ツールバーの Jiandao アイコンをクリックすると設定できます。
  failed: 翻訳に失敗しました
  retry: 再試行
  unknownError: 問題が発生しました
agentInstructions:
  noConfiguration: （まだありません）
  text: |
    ブラウザー拡張機能 Jiandao（简道翻译）でウェブページを翻訳しています。翻訳サービスを設定してください。
    まずガイドを読んでください：$1
    ガイドに従ってください：使いたいサービスと API キーの場所を私に聞いてください。ガイドのリクエストテンプレートを使い、私のキーでリクエストが成功するまで確認してください。翻訳サービスの設定 JSON を私のクリップボードに書き込んでください。最後に、Jiandao の設定ページの「翻訳サービス」に貼り付けて適用するよう伝えてください。
    現在の設定（キーはマスク済み）：
    $2
