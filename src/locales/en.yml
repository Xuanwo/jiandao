agentInstructions:
  noConfiguration: (none yet)
  text: |
    I use the browser extension Plainly (素读) to translate web pages. Please set up its translation service for me.
    Read the guide first: $1
    Follow it: ask me which service I want, where my API key is and which language I read in. Verify with my key using the request template in the guide until a request succeeds. Write the configuration JSON to my clipboard. Then tell me to paste it into the Plainly popup and apply.
    My current configuration, with the key masked:
    $2
