        webContent: Page content (first 2000 characters)
        webSummary: Page summary (needs page context)
      deleteDialog:
        title: Delete "$1"?
        description: This cannot be undone.
        confirm: Delete
        cancel: Cancel
  advanced:
    title: Advanced
    hint: Collapsed by default. Rarely needs changing.
    rate: Requests per second
    capacity: Requests in flight at once
    maxCharactersPerBatch: Characters per request
    maxItemsPerBatch: Paragraphs per request
    preloadMargin: Translate ahead of the viewport (px)
    preloadThreshold: Visible fraction before translating
    minCharacters: Skip paragraphs shorter than N characters
    minWords: Skip paragraphs shorter than N words
    minError: Value must be at least $1
    rangeError: Value must be between $1 and $2
    cache:
      description: Translations are cached in this browser and cleaned up automatically.
      clear: Clear cache
      clearing: Clearing…
      dialog:
        title: Clear the translation cache?
        description: Every cached translation and page summary is removed. Pages will be translated again on demand.
        confirm: Clear
        cancel: Cancel
