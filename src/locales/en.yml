errorRecovery:
  title: Something went wrong
  description: Recovery mode is active. Refresh the page or reset settings and try again.
  recoveryTitle: Recovery options
  refreshPage: Refresh the page
  resetAction: Reset to default settings
  resetSuccess: Recovery completed. Settings have been reset
  resetFailed: Recovery failed. Unable to reset settings
  errorDetails: Error details
  resetDialog:
    title: Reset settings?
    description: This will replace your current settings with the default values.
    confirm: Reset
    cancel: Cancel
options:
  title: Settings
  providers:
    title: Translation service
    description: Pick the one to translate with. Keys stay in this browser; page text goes straight to that service.
    useForTranslation: Use $1 for translation
    keyConfigured: Key set
    keyMissing: No key yet
    add: "Add a service: OpenAI, DeepSeek, or any OpenAI-compatible endpoint"
    addChoice:
      openai: OpenAI
      deepseek: DeepSeek
      openaiCompatible: OpenAI-compatible endpoint
    duplicate: Duplicate
    delete: Delete
    duplicateName: 'Another service is already named "$1"'
    atLeastOne: Keep at least one translation service.
    deleteDialog:
      title: Delete this service?
      description: This cannot be undone. If it was used for translation, another service takes over.
      confirm: Delete
      cancel: Cancel
    form:
      name: Name
      apiKey: API Key
      showApiKey: Show key
      baseURL: Base URL
      optional: optional
      model: Model
      advanced: "Advanced: temperature, headers, provider options"
      temperature: Temperature
      temperatureHint: Controls randomness in responses. Lower values (0) are more deterministic, higher values are more creative. Range varies by provider. Leave empty to use the provider default.
      headers: Headers
      headersHint: Custom HTTP headers sent when creating the AI provider client. Leave empty to use provider defaults; use {} to disable defaults.
      providerOptions: Provider options
      providerOptionsHint: Provider-specific options for non-standard API features like thinking/reasoning mode. See the Vercel AI SDK docs or your provider's documentation.
      providerOptionsDocsLink: View provider docs
      providerOptionsRecommendationTrigger: View recommended provider options
      providerOptionsRecommendationTitle: Recommended provider options detected
      providerOptionsRecommendationDescription: Review and apply the recommended configuration.
      providerOptionsRecommendationApply: Apply
      providerOptionsRecommendationApplied: Applied
      invalidJson: Invalid JSON
      testConnection:
        button: Test connection
        testing: Testing…
      models:
        fetchModels: Fetch available models
        fetchError: Failed to fetch models
        clickToRetry: Click to retry
        noModels: No models available
        selectModel: Select a model
        searchModels: Search models…
        noModelsFound: No models found
        required: Enter a model ID.
  reading:
    title: Reading
    description: How translations appear on the page.
    mode:
      title: Display
      bilingual: Bilingual
      translationOnly: Translation only
    style:
      title: Translation style
      custom: Custom CSS
      presets:
        line: Hairline
        default: None
        weakened: Muted
        textColor: Tinted
        dashedLine: Dashed underline
        background: Highlight
        blockquote: Quote bar
        border: Outline
        blur: Reveal on hover
      cssPlaceholder: |
        /* Example: tint and highlight the translation */
        [data-plainly-custom-translation-style='custom'] {
          color: #414535;
          background-color: light-dark(#F2E3BC, #C19875);
          padding: 2px 4px;
          border-radius: 4px;
        }
      css:
        save: Save
        saved: Saved
        validating: Checking…
        valid: CSS is valid
        syntaxError: CSS has syntax errors
        tooLong: CSS is too long
        allSaved: All changes saved
    range:
      title: Translate
      description: '"Main content" skips navigation, sidebars and footers.'
      main: Main content
      all: Whole page
    shortcut:
      title: Shortcut
      description: Press it on any page to translate or restore. Clear it to turn the shortcut off.
  quality:
    title: Translation quality
    description: What the model knows about the page it is translating.
    context:
      title: Use page context
      description: Lets the model read a summary of the page before translating each paragraph. Starting takes a few seconds longer and uses more tokens.
    prompts:
      title: Prompt
      default: Default
      new: New
      view: View
      edit: Edit
      delete: Delete
      import: Import
      export: Export
      importSuccess: Prompts imported
      importFailed: Could not import prompts
      editor:
        newTitle: New prompt
        editTitle: Edit prompt
        name: Name
        systemPrompt: System prompt
        prompt: Prompt
        save: Save
        cancel: Cancel
      tokens:
        input: Text to translate
        targetLanguage: Target language
        webTitle: Page title
        webDescription: Page description from metadata
        webContent: Page content (first 2000 characters)
        webSummary: Page summary (needs page context)
      deleteDialog:
        title: Delete "$1"?
        description: This cannot be undone.
        confirm: Delete
        cancel: Cancel
  advanced:
    title: Advanced
    hint: Collapsed by default. Rarely needs changing.
    rate: Requests per second
    capacity: Requests in flight at once
    maxCharactersPerBatch: Characters per request
    maxItemsPerBatch: Paragraphs per request
    preloadMargin: Translate ahead of the viewport (px)
    preloadThreshold: Visible fraction before translating
    minCharacters: Skip paragraphs shorter than N characters
    minWords: Skip paragraphs shorter than N words
    minError: Value must be at least $1
    rangeError: Value must be between $1 and $2
    cache:
      description: Translations are cached in this browser and cleaned up automatically.
      clear: Clear cache
      clearing: Clearing…
      dialog:
        title: Clear the translation cache?
        description: Every cached translation and page summary is removed. Pages will be translated again on demand.
        confirm: Clear
        cancel: Cancel
  appearance:
    title: Appearance
    system: System
    light: Light
    dark: Dark
  reset:
    title: Reset all settings
    dialog:
      title: Reset all settings?
      description: Every setting, including API keys and prompts, goes back to its default value.
      confirm: Reset
      cancel: Cancel
