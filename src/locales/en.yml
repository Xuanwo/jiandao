agentInstructions:
  noConfiguration: (none yet)
  text: |
    I use the browser extension Jiandao (简道翻译) to translate web pages. Please set up its translation service for me.
    Read the guide first: $1
    Follow it: ask me which service I want and where my API key is. Verify with my key using the request template in the guide until a request succeeds. Write the service configuration JSON to my clipboard. Then tell me to paste it under "Translation service" on the Jiandao settings page and apply it.
    My current configuration, with the key masked:
    $2
