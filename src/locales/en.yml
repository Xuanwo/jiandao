      title: Import configuration
      description: Paste the configuration your agent put on the clipboard. The agent already verified it against the service; Plainly sends one short request to confirm.
      pasteLabel: Configuration JSON
      previewTitle: What will be applied
      empty: The preview appears once the pasted text is a valid configuration.
      replaces: The stored $1 service is replaced. Other services and settings stay.
      adds: A new service is added. Other services and settings stay.
      clearsClipboard: The clipboard is cleared after applying.
      confirming: Applied. Confirming the connection…
      done: Connected. Translation uses this service now.
      cancel: Cancel
      close: Close
      apply: Apply and confirm connection
  reading:
    title: Reading
    description: How translations appear on the page.
    mode:
      title: Display
      bilingual: Bilingual
      translationOnly: Translation only
    style:
      title: Translation style
      custom: Custom CSS
      presets:
        line: Hairline
