      title: Translate
      description: '"Main content" skips navigation, sidebars and footers.'
      main: Main content
      all: Whole page
    shortcut:
      title: Shortcut
      description: Press it on any page to translate or restore. Clear it to turn the shortcut off.
  quality:
    title: Translation quality
    description: What the model knows about the page it is translating.
    context:
      title: Use page context
      description: Lets the model read a summary of the page before translating each paragraph. Starting takes a few seconds longer and uses more tokens.
