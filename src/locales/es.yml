agentInstructions:
  noConfiguration: (aún ninguna)
  text: |
    Uso la extensión de navegador Jiandao (简道翻译) para traducir páginas web. Configura su servicio de traducción, por favor.
    Lee primero la guía: $1
    Síguela: pregúntame qué servicio quiero, dónde está mi clave API y en qué idioma leo. Verifica la configuración con mi clave y la plantilla de solicitud de la guía hasta que una solicitud funcione. Escribe el JSON de configuración en mi portapapeles. Después dime que lo pegue en la ventana emergente de Jiandao y lo aplique.
    Mi configuración actual, con la clave oculta:
    $2
