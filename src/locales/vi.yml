agentInstructions:
  noConfiguration: (chưa có)
  text: |
    Tôi dùng tiện ích trình duyệt Plainly (素读) để dịch trang web. Hãy thiết lập dịch vụ dịch của nó cho tôi.
    Trước hết hãy đọc hướng dẫn: $1
    Làm theo hướng dẫn: hỏi tôi muốn dùng dịch vụ nào, API Key của tôi ở đâu và tôi đọc bằng ngôn ngữ nào. Xác minh bằng khóa của tôi với mẫu yêu cầu trong hướng dẫn cho đến khi một yêu cầu thành công. Ghi JSON cấu hình vào bộ nhớ tạm của tôi. Sau đó bảo tôi dán nó vào cửa sổ bật lên của Plainly và áp dụng.
    Cấu hình hiện tại của tôi, khóa đã được che:
    $2
