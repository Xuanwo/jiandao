agentInstructions:
  noConfiguration: (henüz yok)
  text: |
    Web sayfalarını Jiandao (简道翻译) tarayıcı eklentisiyle çeviriyorum. Lütfen çeviri hizmetini benim için ayarla.
    Önce kılavuzu oku: $1
    Kılavuzu izle: hangi hizmeti kullanmak istediğimi ve API anahtarımın nerede olduğunu bana sor. Kılavuzdaki istek şablonuyla anahtarımı kullanarak bir istek başarılı olana kadar doğrula. Hizmet yapılandırması JSON'unu panoma yaz. Son olarak bana bunu Jiandao ayarlar sayfasındaki "Çeviri hizmeti" bölümüne yapıştırıp uygulamamı söyle.
    Mevcut yapılandırmam, anahtar gizlenmiş:
    $2
