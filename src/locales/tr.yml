agentInstructions:
  noConfiguration: (henüz yok)
  text: |
    Web sayfalarını çevirmek için Plainly (素读) tarayıcı uzantısını kullanıyorum. Lütfen çeviri hizmetini benim için ayarla.
    Önce kılavuzu oku: $1
    Kılavuzu izle: hangi hizmeti istediğimi, API anahtarımın nerede olduğunu ve hangi dilde okuduğumu bana sor. Kılavuzdaki istek şablonuyla anahtarımı kullanarak bir istek başarılı olana kadar doğrula. Yapılandırma JSON'unu panoma yaz. Sonra bana bunu Plainly açılır penceresine yapıştırıp uygulamamı söyle.
    Anahtarı gizlenmiş geçerli yapılandırmam:
    $2
