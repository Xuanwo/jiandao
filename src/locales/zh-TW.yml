agentInstructions:
  noConfiguration: （尚未設定）
  text: |
    我在用瀏覽器擴充功能簡道翻譯（Jiandao）來翻譯網頁，請幫我設定它的翻譯服務。
    先閱讀說明：$1
    依照說明操作：問清楚我要用哪家服務、API 金鑰在哪裡、我讀什麼語言；用我的金鑰依照說明裡的請求範本驗證，直到請求成功；把設定 JSON 寫入我的剪貼簿；最後告訴我在 Jiandao 彈出視窗裡貼上並套用。
    我目前的設定（金鑰已遮蔽）：
    $2
