name: Release Extension

# Bump "version" in package.json, merge it, then push a matching tag
# (e.g. v1.35.0). Store submission runs separately via submit.yml.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild assets for (e.g., v1.35.0)"
        required: true
        type: string

concurrency: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Release Extension
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      HUSKY: 0
    steps:
      - name: Checkout Release Tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}

      - name: Check Tag Matches package.json Version
        run: |
          VERSION=$(jq -r .version package.json)
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          # A job that publishes release assets must not restore a cache.
          package-manager-cache: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm test

      - name: Build and Zip Extension
        run: pnpm zip:all

      - name: Create GitHub Release
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload Extension Zips to Release
        run: gh release upload "$TAG" .output/*-chrome.zip .output/*-edge.zip .output/*-firefox.zip .output/*-sources.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
