name: Submit to Stores

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to submit (e.g., v1.20.0)"
        required: true
        type: string
      dryRun:
        description: Dry run (skip actual submission)
        required: false
        default: false
        type: boolean

jobs:
  submit:
    name: Submit to Stores
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Release Tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          # A job that publishes release assets must not restore a cache.
          package-manager-cache: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm test

      # Edge gets its own build: Edge Add-ons assigns its own ID and must not
      # receive the Chrome Web Store key.
      - name: Build and Zip Extension
        run: |
          pnpm zip
          pnpm zip:edge

      - name: Submit to Chrome & Edge Stores
        run: |
          ARGS=(--chrome-zip .output/*-chrome.zip)
          # Edge is optional until its Partner Center secrets are configured.
          if [ -n "$EDGE_PRODUCT_ID" ]; then
            ARGS+=(--edge-zip .output/*-edge.zip)
          fi
          pnpm wxt submit "${ARGS[@]}"
        env:
          DRY_RUN: ${{ inputs.dryRun }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
