<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>页面内 · 表格仅译文</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#222930;color:#D1D7E0;font-family:-apple-system,"SF Pro Text","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif}
.window{width:880px;height:460px;border:1px solid #444C56;border-radius:12px;overflow:hidden}
.bar{height:44px;background:#2D333B;border-bottom:1px solid #444C56;display:flex;align-items:center;padding:0 16px;font-size:12px;color:#ADB6C2}
article{padding:32px 40px;font-size:16px;line-height:1.6}
h1{font-size:26px;line-height:1.3;margin:0 0 28px}
a{color:#58A6FF}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #444C56;padding:10px 14px;text-align:left;vertical-align:top}
th:first-child{width:28%}
</style>
</head>
<body>
<div class="window">
  <div class="bar">example.org/tools</div>
  <article>
    <h1>工具目录</h1>
    <table>
      <thead><tr><th scope="col">工具</th><th scope="col">说明</th></tr></thead>
      <tbody>
        <tr><td><a href="https://example.org/tools/checker">发布检查器</a></td><td>在发布新版本前检查发布包。</td></tr>
        <tr><td><a href="https://example.org/tools/mapper">源码映射器</a></td><td>查找源码位置，保留文件之间的链接。</td></tr>
        <tr><td><a href="https://example.org/tools/report">覆盖率报告</a></td><td>列出已测试的路径和尚未覆盖的边界情况。</td></tr>
      </tbody>
    </table>
  </article>
</div>
</body>
</html>
